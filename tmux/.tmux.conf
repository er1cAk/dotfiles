# ===========================================================================
#  tmux - Catppuccin Mocha, matched to Alacritty and NvChad
# ===========================================================================

# --- prefix -----------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- terminal / colours -----------------------------------------------------
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB,xterm-256color:RGB,*256col*:RGB"
set -as terminal-features ",alacritty:RGB"

# --- behaviour --------------------------------------------------------------
set  -g mouse on
set  -g history-limit 100000
set  -s escape-time 10          # do not swallow <Esc> in Neovim
set  -g focus-events on         # let Neovim notice external file changes
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g set-clipboard on
set  -g display-time 2000
set  -g status-interval 5
setw -g mode-keys vi
setw -g automatic-rename on
set  -g set-titles on
set  -g set-titles-string "#S / #W"

# --- reload -----------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "✓ tmux.conf reloaded"

# --- windows and panes ------------------------------------------------------
# new window / splits keep the current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"

# Keep tmux's built-in guard: Cmd-W in Alacritty sends prefix+x, and that is
# muscle memory for "close a tab" -- without the prompt it destroys whatever is
# running in the pane.
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize (repeatable: hold the key after the prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window navigation without the prefix
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -r p previous-window
bind -r n next-window

bind Space next-layout
bind z resize-pane -Z

# --- copy mode (vi keys, straight to the macOS clipboard) -------------------
bind Enter copy-mode
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ===========================================================================
#  Catppuccin Mocha status line
# ===========================================================================
# palette
#   base     #1e1e2e     surface0 #313244     surface1 #45475a
#   text     #cdd6f4     overlay0 #6c7086     blue     #89b4fa
#   mauve    #cba6f7     green    #a6e3a1     peach    #fab387

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]#[default] "

set -g status-right-length 80
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#fab387]PREFIX ,}#[fg=#45475a]#[bg=#45475a,fg=#cdd6f4] #{pane_current_command} #[bg=#45475a,fg=#cba6f7]#[bg=#cba6f7,fg=#1e1e2e,bold] %a %d %b  %H:%M "

setw -g window-status-format "#[fg=#6c7086,bg=#1e1e2e]  #I #W  "
setw -g window-status-current-format "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244,bold] #I #W #[fg=#313244,bg=#1e1e2e]"
setw -g window-status-separator ""

setw -g mode-style "bg=#585b70,fg=#cdd6f4"
set -g clock-mode-colour "#89b4fa"
