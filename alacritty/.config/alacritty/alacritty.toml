# ===========================================================================
#  Alacritty - macOS
#  Theme: Catppuccin Mocha | Font: JetBrainsMono Nerd Font
#  Opens straight into a persistent tmux session called "main".
# ===========================================================================

[general]
live_config_reload = true

[env]
TERM = "alacritty"

# --- window ----------------------------------------------------------------
[window]
opacity = 0.95
blur = true
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "Buttonless"
decorations_theme_variant = "Dark"
startup_mode = "Windowed"
dynamic_title = true
# send Alt for the Option key so <A-j>/<A-k> work in Neovim and tmux
option_as_alt = "Both"

[window.dimensions]
columns = 200
lines = 55

# --- font ------------------------------------------------------------------
# The "Mono" variant matters: in the plain family, Nerd Font icon ink is ~155% of
# the cell width while still advancing only one cell, so icons bleed into the next
# cell and the block cursor clips them. "Mono" scales icon ink to exactly one cell.
[font]
size = 16.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

# Line spacing. Both default to 0 = the font's natural metrics.
# Raising offset.y adds space *between* lines; it does not widen glyphs, so
# large values make the text read as tall and narrow.
[font.offset]
x = 1          # widen each cell by 1px -- cell ratio 0.45 -> 0.50
y = 0

[font.glyph_offset]
x = 0
y = 0

[scrolling]
history = 100000
multiplier = 3

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
unfocused_hollow = true
thickness = 0.15

# --- shell: drop straight into a persistent tmux session -------------------
# Comment this block out if you ever want a bare shell instead.
[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "exec ~/.config/alacritty/tmux-session.sh || exec /bin/zsh -l"]

# ===========================================================================
#  Colours - Catppuccin Mocha
# ===========================================================================
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[colors.dim]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[[colors.indexed_colors]]
index = 16
color = "#fab387"

[[colors.indexed_colors]]
index = 17
color = "#f5e0dc"

# ===========================================================================
#  Keyboard - macOS Cmd bindings layered on top of the defaults.
#  The \u0001 in the bindings below is Ctrl-a, the tmux prefix,
# ===========================================================================
[keyboard]
bindings = [
  # Shift+Enter -> ESC CR, which Claude Code (and most REPLs) read as a newline
  # rather than a submit. This is the exact binding `claude /terminal-setup`
  # installs; it is written here by hand because that command appends a
  # [[keyboard.bindings]] table, which TOML forbids alongside this inline array.
  { key = "Return",   mods = "Shift",         chars = "\u001B\r" },

  # windows / view
  { key = "N",        mods = "Command",       action = "CreateNewWindow" },
  { key = "Enter",    mods = "Command",       action = "ToggleFullscreen" },

  # font size
  { key = "=",        mods = "Command",       action = "IncreaseFontSize" },
  { key = "+",        mods = "Command",       action = "IncreaseFontSize" },
  { key = "-",        mods = "Command",       action = "DecreaseFontSize" },
  { key = "0",        mods = "Command",       action = "ResetFontSize" },

  # scrollback
  { key = "K",        mods = "Command",       action = "ClearHistory" },
  { key = "PageUp",   mods = "Shift",         action = "ScrollPageUp",   mode = "~Alt" },
  { key = "PageDown", mods = "Shift",         action = "ScrollPageDown", mode = "~Alt" },
  { key = "Home",     mods = "Shift",         action = "ScrollToTop",    mode = "~Alt" },
  { key = "End",      mods = "Shift",         action = "ScrollToBottom", mode = "~Alt" },

  # vi mode + search
  { key = "Space",    mods = "Control|Shift", action = "ToggleViMode" },
  { key = "F",        mods = "Command",       action = "SearchForward" },
  { key = "B",        mods = "Command",       action = "SearchBackward" },

  # Cmd shortcuts that drive tmux (Warp-like tabs and splits)
  { key = "T",        mods = "Command",       chars = "\u0001c" },
  { key = "W",        mods = "Command",       chars = "\u0001x" },
  { key = "D",        mods = "Command",       chars = "\u0001|" },
  { key = "D",        mods = "Command|Shift", chars = "\u0001-" },
  { key = "1",        mods = "Command",       chars = "\u00011" },
  { key = "2",        mods = "Command",       chars = "\u00012" },
  { key = "3",        mods = "Command",       chars = "\u00013" },
  { key = "4",        mods = "Command",       chars = "\u00014" },
  { key = "5",        mods = "Command",       chars = "\u00015" },
  { key = "6",        mods = "Command",       chars = "\u00016" },
  { key = "7",        mods = "Command",       chars = "\u00017" },
  { key = "8",        mods = "Command",       chars = "\u00018" },
  { key = "9",        mods = "Command",       chars = "\u00019" },
  { key = "[",        mods = "Command|Shift", chars = "\u0001p" },
  { key = "]",        mods = "Command|Shift", chars = "\u0001n" },

  # Cmd-P: visual picker for every tmux window (like Cmd-P "go to tab").
  { key = "P",        mods = "Command",       chars = "\u0001w" },
  # Cmd-Shift-W: close the whole tmux window, not just this pane (confirms first).
  { key = "W",        mods = "Command|Shift", chars = "\u0001X" },
  # Cmd-Shift-Enter: zoom the current pane to fill the window (toggle).
  { key = "Enter",    mods = "Command|Shift", chars = "\u0001z" },
]
